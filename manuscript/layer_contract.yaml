  adapter:
    files:
      - src/from_russia_with_love/mission.py
    rule: only module importing bond_api (frozen protocol)
  workflow:
    files:
      - src/from_russia_with_love/manuscript_variables.py
      - src/from_russia_with_love/figures/lure_surface.py
