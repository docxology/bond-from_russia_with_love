# From Russia with Love (1963) — PROJECT BOND film package · mission codename LURES
# A standalone BOND suite package, mirrored to the private remote
# docxology/bond-from_russia_with_love (default branch main).
# bond-api is the frozen MissionProvider protocol this film implements.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "from_russia_with_love"
version = "0.1.0"
license = { text = "MIT" }
description = "LURES — entrapment/deception playbook engine, SIGINT channel interception, and defector handoff protocol (From Russia with Love, 1963)"
authors = [
    { name = "Daniel Ari Friedman", email = "daniel@activeinference.institute" }
]
requires-python = ">=3.10"
# Floors unchanged this pass: an install cannot be resolved under the drive's
# ~10-minute budget, so the currency bump is deferred rather than shipped
# unverified. The sibling bond-api source below is a correctness fix.
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "bond-api",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.4.0",
    "types-PyYAML>=6.0.12",
]

[tool.uv.sources]
# Sibling bond-api checkout (same layout in the bond working tree: ../bond-api).
bond-api = { path = "../bond-api" }

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
explicit_package_bases = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# bond-api ships no py.typed marker; its frozen protocol is consumed as-is.
module = "bond_api.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "SIM"]
