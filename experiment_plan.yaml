# Experiment plan — LURES (From Russia with Love, 1963)

mission:
  codename: LURES
  seed: 11

conditions:
  - name: lure-campaign
    engine: entrapment_engine
    lure_id: honey-trap-alpha
    engagement_threshold: 0.5
  - name: bait-allocation
    engine: bait_allocation
    budget: 5
    lure_strength: 0.6
  - name: sigint-intercept
    engine: sigint
    snr_db: 80.0
    cipher_layers: 2
  - name: tdoa-geolocation
    engine: direction_finding
    receivers: 4
    noise_std: 0.1
  - name: courier-schedule
    engine: courier_schedule
    rendezvous: 5
    start_time: 0.0
  - name: defector-handoff
    engine: handoff_protocol
    call_sign: ROZA
    path: green + red drill

primary_metric:
  - recovered_exact
  - tdoa_error < 0.5
  - schedule_count >= 1
  - handoff_state == handoff

expected_artifacts:
  - output/figures/lure_surface.png
  - output/figures/tdoa_geometry.png

baseline:
  - deterministic byte-identity across reruns
  # NOT "exact dominates greedy" — that is a theorem about the exact solver,
  # true by construction and unable to fail on any scenario. The measurable
  # baselines are the gap sizes, which differ per instance.
  - measured exact-minus-greedy allocation gap on the canonical target pool
    (zero: greedy ties the exact knapsack there)
  - measured exact-minus-greedy allocation gap on GREEDY_WITNESS_TARGETS
    (strictly positive: the instance that actually separates the solvers)
