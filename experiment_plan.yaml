# Experiment plan — LURES (From Russia with Love, 1963)

mission:
  codename: LURES
  seed: 11

conditions:
  - name: lure-campaign
    engine: entrapment_engine
    lure_id: honey-trap-alpha
    engagement_threshold: 0.5
  - name: sigint-intercept
    engine: sigint
    snr_db: 80.0
    cipher_layers: 2
  - name: defector-handoff
    engine: handoff_protocol
    call_sign: ROZA
    path: green

primary_metric:
  - recovered_exact
  - handoff_state == handoff

expected_artifacts:
  - output/figures/lure_surface.png

baseline:
  - deterministic byte-identity across reruns
