# Domain profile — LURES (From Russia with Love, 1963)

mission:
  codename: LURES
  film: from_russia_with_love
  concepts:
    - entrapment/deception playbook engine
    - lure-budget allocation (0/1 knapsack)
    - SIGINT channel interception simulation
    - TDOA direction finding (Gauss-Newton)
    - courier handoff scheduling (interval)
    - defector handoff protocol

review_gates:
  coverage_percent: 90.0
  zero_mocks: true
  deterministic: true
  ruff: true
  mypy: true

source_policy:
  local_only: true
  no_remote: true
  dependencies: ["bond-api (frozen protocol, path dependency)"]

artifact_expectations:
  - output/figures/lure_surface.png
  - output/figures/tdoa_geometry.png
  - output/data/manuscript_variables.json

benchmark_rubric:
  preferred: coverage gate on src/
